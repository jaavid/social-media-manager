name: Finalize Batch B review fixes

on:
  push:
    branches:
      - feat/connected-accounts-batch-b
    paths:
      - .github/workflows/batch-b-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/connected-accounts-batch-b
          fetch-depth: 0

      - name: Apply remaining verified review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('backend/social_stats/oauth_views.py')
          s = p.read_text()
          if 'from django.db.models.functions import Coalesce' not in s:
              s = s.replace('from django.utils import timezone\n', 'from django.utils import timezone\nfrom django.db.models.functions import Coalesce\n', 1)
          old = "        last_sync = SyncLog.objects.filter(\n            client_id=client_id,\n            platform=platform,\n            status='success',\n        ).order_by('-finished_at', '-started_at').first()"
          new = "        last_sync = SyncLog.objects.filter(\n            client_id=client_id,\n            platform=platform,\n            status='success',\n        ).annotate(\n            effective_sync_at=Coalesce('finished_at', 'started_at')\n        ).order_by('-effective_sync_at').first()"
          if old not in s:
              raise SystemExit('oauth status SyncLog ordering source not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('frontend/src/services/api.js')
          s = p.read_text()
          old = "function _redirectToLogin() {\n  invalidateSession();\n  if (typeof window === 'undefined') return;"
          new = "function _redirectToLogin(expectedAccessToken) {\n  const invalidated = invalidateSession({ expectedAccessToken });\n  if (!invalidated || typeof window === 'undefined') return;"
          if old not in s:
              raise SystemExit('API redirect helper source not found')
          s = s.replace(old, new, 1)
          old = "    try {\n      const access = await refreshAccessToken();\n      original.headers.Authorization = `Bearer ${access}`;\n      return api(original);\n    } catch {\n      _redirectToLogin();\n      return Promise.reject(error);\n    }"
          new = "    const authorization = original?.headers?.get?.('Authorization') || original?.headers?.Authorization || original?.headers?.authorization || '';\n    const failedAccessToken = typeof authorization === 'string' && authorization.startsWith('Bearer ') ? authorization.slice(7) : localStorage.getItem('access_token');\n\n    try {\n      const access = await refreshAccessToken(failedAccessToken);\n      original.headers.Authorization = `Bearer ${access}`;\n      return api(original);\n    } catch {\n      _redirectToLogin(failedAccessToken);\n      return Promise.reject(error);\n    }"
          if old not in s:
              raise SystemExit('API refresh retry source not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Remove finalizer and commit
        shell: bash
        run: |
          rm -f .github/workflows/batch-b-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/social_stats/oauth_views.py frontend/src/services/api.js .github/workflows/batch-b-finalize.yml
          git commit -m "fix: close remaining Batch B review findings"
          git push origin HEAD:feat/connected-accounts-batch-b
