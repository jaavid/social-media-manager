name: Batch B one-shot patch

on:
  push:
    branches:
      - feat/connected-accounts-batch-b
    paths:
      - .github/workflows/batch-b-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/connected-accounts-batch-b
          fetch-depth: 0

      - name: Patch auth/session integration and connection health
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          api_path = Path('frontend/src/services/api.js')
          api = api_path.read_text()
          api = api.replace(
              "import axios from 'axios';\n",
              "import axios from 'axios';\n"
              "import { invalidateSession, onSessionInvalidated, refreshAccessToken } from '../lib/auth/session';\n\n"
              "export { invalidateSession, onSessionInvalidated };\n",
              1,
          )
          api, count = re.subn(
              r"// Authentication is process-wide, so refresh coordination must be process-wide too\.\n"
              r"// Consumers use this signal to stop pollers before navigation can render again\.\n"
              r"const sessionInvalidationListeners = new Set\(\);\n"
              r"let refreshPromise = null;\n\n"
              r"export function onSessionInvalidated\(listener\) \{.*?\n\}\n\n"
              r"export function invalidateSession\(\) \{.*?\n\}\n\n",
              "",
              api,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not remove legacy auth coordinator from api.js')

          old_refresh = '''    try {
              if (!refreshPromise) {
                refreshPromise = axios.post(
                  `${process.env.REACT_APP_API_URL || 'http://localhost:8000/api'}/auth/refresh/`,
                  { refresh }
                ).then((res) => {
                  localStorage.setItem('access_token', res.data.access);
                  return res.data.access;
                }).finally(() => { refreshPromise = null; });
              }
              const access = await refreshPromise;
          '''
          # Preserve source indentation exactly by matching semantically with a regex.
          api, count = re.subn(
              r"    try \{\n"
              r"      if \(!refreshPromise\) \{.*?\n"
              r"      \}\n"
              r"      const access = await refreshPromise;",
              "    try {\n      const access = await refreshAccessToken();",
              api,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not replace legacy refresh block in api.js')
          api_path.write_text(api)

          realtime_path = Path('frontend/src/hooks/useRealtime.js')
          realtime = realtime_path.read_text()
          realtime = realtime.replace(
              "import { createContext, useCallback, useContext, useEffect, useMemo, useRef, useState } from 'react';\n",
              "import { createContext, useCallback, useContext, useEffect, useMemo, useRef, useState } from 'react';\n"
              "import { invalidateSession, refreshAccessToken } from '../lib/auth/session';\n",
              1,
          )
          old_close = '''    ws.onclose = (e) => {
              if (pingTimer.current) { clearInterval(pingTimer.current); pingTimer.current = null; }
              wsRef.current = null;
              setStatus('closed');
              // 4401 = auth required (token missing/invalid). Don't auto-retry.
              if (e.code === 4401 || e.code === 4403) return;
              scheduleReconnect();
            };'''
          new_close = '''    ws.onclose = async (e) => {
              if (pingTimer.current) { clearInterval(pingTimer.current); pingTimer.current = null; }
              wsRef.current = null;
              setStatus('closed');

              // 4401 means the JWT is missing/expired. Share the exact same refresh
              // coordinator used by HTTP requests, then reconnect with the new token.
              if (e.code === 4401) {
                try {
                  await refreshAccessToken();
                  attempt.current = 0;
                  connect();
                } catch {
                  invalidateSession();
                }
                return;
              }
              // 4403 is an authorization failure, not an expired session; refreshing
              // cannot grant a permission the user does not have.
              if (e.code === 4403) return;
              scheduleReconnect();
            };'''
          if old_close not in realtime:
              raise SystemExit('Could not find WebSocket close handler')
          realtime = realtime.replace(old_close, new_close, 1)
          realtime_path.write_text(realtime)

          oauth_path = Path('backend/social_stats/oauth_views.py')
          oauth = oauth_path.read_text()
          oauth = oauth.replace(
              'from .models import PlatformCredential, Client\n',
              'from .models import PlatformCredential, Client, SyncLog\n',
              1,
          )
          needle = '''        cred = credentials.filter(platform=platform).first()
              if cred and cred.access_token:'''
          replacement = '''        cred = credentials.filter(platform=platform).first()
              last_sync = SyncLog.objects.filter(
                  client_id=client_id,
                  platform=platform,
                  status='success',
              ).order_by('-finished_at', '-started_at').first()
              last_successful_sync = (
                  (last_sync.finished_at or last_sync.started_at).isoformat()
                  if last_sync else None
              )
              if cred and cred.access_token:'''
          if needle not in oauth:
              # Source indentation is 8 spaces; avoid silently producing a partial patch.
              needle = "        cred = credentials.filter(platform=platform).first()\n        if cred and cred.access_token:"
              replacement = "        cred = credentials.filter(platform=platform).first()\n        last_sync = SyncLog.objects.filter(\n            client_id=client_id,\n            platform=platform,\n            status='success',\n        ).order_by('-finished_at', '-started_at').first()\n        last_successful_sync = (\n            (last_sync.finished_at or last_sync.started_at).isoformat()\n            if last_sync else None\n        )\n        if cred and cred.access_token:"
          if needle not in oauth:
              raise SystemExit('Could not find oauth_status credential lookup')
          oauth = oauth.replace(needle, replacement, 1)
          oauth = oauth.replace(
              "                'account_name': cred.page_name or cred.channel_name or cred.organization_name or '',\n",
              "                'account_name': cred.page_name or cred.channel_name or cred.organization_name or '',\n"
              "                'last_successful_sync': last_successful_sync,\n",
              1,
          )
          oauth = oauth.replace(
              "            result[platform] = {'status': 'not_connected'}\n",
              "            result[platform] = {\n"
              "                'status': 'not_connected',\n"
              "                'last_successful_sync': last_successful_sync,\n"
              "            }\n",
              1,
          )
          oauth_path.write_text(oauth)

          connected_path = Path('frontend/src/components/ui/ConnectedAccounts.jsx')
          connected = connected_path.read_text().replace(
              "    if (!value || !navigator?.clipboard) return;",
              "    if (!value || typeof navigator === 'undefined' || !navigator.clipboard) return;",
              1,
          )
          connected_path.write_text(connected)
          PY

      - name: Add auth session regression tests
        shell: bash
        run: |
          cat > frontend/src/lib/auth/session.test.js <<'EOF'
          import axios from 'axios';
          import { invalidateSession, refreshAccessToken } from './session';

          jest.mock('axios');

          describe('auth session coordinator', () => {
            beforeEach(() => {
              localStorage.clear();
              axios.post.mockReset();
              Object.defineProperty(navigator, 'locks', {
                configurable: true,
                value: undefined,
              });
            });

            test('serializes concurrent refreshes and persists rotated refresh tokens', async () => {
              localStorage.setItem('access_token', 'access-old');
              localStorage.setItem('refresh_token', 'refresh-old');

              let resolveRefresh;
              axios.post.mockReturnValue(new Promise((resolve) => { resolveRefresh = resolve; }));

              const first = refreshAccessToken();
              const second = refreshAccessToken();
              expect(axios.post).toHaveBeenCalledTimes(1);

              resolveRefresh({ data: { access: 'access-new', refresh: 'refresh-new' } });
              await expect(first).resolves.toBe('access-new');
              await expect(second).resolves.toBe('access-new');
              expect(localStorage.getItem('access_token')).toBe('access-new');
              expect(localStorage.getItem('refresh_token')).toBe('refresh-new');
            });

            test('reuses a token refreshed by another tab after acquiring the browser lock', async () => {
              localStorage.setItem('access_token', 'access-old');
              localStorage.setItem('refresh_token', 'refresh-old');
              const request = jest.fn(async (_name, callback) => {
                localStorage.setItem('access_token', 'access-from-other-tab');
                return callback();
              });
              Object.defineProperty(navigator, 'locks', {
                configurable: true,
                value: { request },
              });

              await expect(refreshAccessToken()).resolves.toBe('access-from-other-tab');
              expect(request).toHaveBeenCalledTimes(1);
              expect(axios.post).not.toHaveBeenCalled();
            });

            test('invalidates auth tokens without clearing unrelated preferences', () => {
              localStorage.setItem('access_token', 'access');
              localStorage.setItem('refresh_token', 'refresh');
              localStorage.setItem('language', 'fa');

              invalidateSession();

              expect(localStorage.getItem('access_token')).toBeNull();
              expect(localStorage.getItem('refresh_token')).toBeNull();
              expect(localStorage.getItem('language')).toBe('fa');
            });
          });
          EOF

      - name: Run focused frontend tests
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          npm ci
          npm test -- --watchAll=false --runInBand src/lib/auth/session.test.js

      - name: Commit one-shot patch and remove workflow
        shell: bash
        run: |
          rm .github/workflows/batch-b-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: coordinate auth refresh and connection health [skip batch-b-patch]'
          git push origin HEAD:feat/connected-accounts-batch-b
