name: Batch B review fixes v3

on:
  push:
    branches: [feat/connected-accounts-batch-b]
    paths: [.github/workflows/batch-b-review-fixes-v3.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/connected-accounts-batch-b
          fetch-depth: 0

      - name: Apply verified review findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, repl, label, flags=0):
              updated, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected source not found')
              return updated

          # OAuth readiness: GMB has its own business.manage scope.
          p = Path('backend/social_stats/oauth_readiness.py')
          s = p.read_text()
          s = sub_once(
              s,
              r"(GOOGLE_SCOPES = \[.*?\]\n)(\nLINKEDIN_SCOPES)",
              r"\1\nGMB_SCOPES = [\n    'https://www.googleapis.com/auth/business.manage',\n    'openid',\n    'email',\n    'profile',\n]\n\2",
              'oauth readiness scopes',
              re.S,
          )
          s = sub_once(
              s,
              r"('google_my_business': \{\s*\*\*google,\s*)(?='required_apis')",
              r"\1'scopes': GMB_SCOPES,\n            ",
              'oauth readiness GMB payload',
              re.S,
          )
          p.write_text(s)

          # Sync health: sort by the effective timestamp we actually return.
          p = Path('backend/social_stats/oauth_views.py')
          s = p.read_text()
          if 'from django.db.models.functions import Coalesce' not in s:
              s = s.replace(
                  'from django.utils import timezone\n',
                  'from django.utils import timezone\nfrom django.db.models.functions import Coalesce\n',
                  1,
              )
          s = sub_once(
              s,
              r"last_sync = SyncLog\.objects\.filter\(\s*client_id=client_id,\s*platform=platform,\s*status='success',\s*\)\.order_by\('-finished_at', '-started_at'\)\.first\(\)",
              "last_sync = SyncLog.objects.filter(\n            client_id=client_id,\n            platform=platform,\n            status='success',\n        ).annotate(\n            effective_sync_at=Coalesce('finished_at', 'started_at')\n        ).order_by('-effective_sync_at').first()",
              'oauth status SyncLog ordering',
              re.S,
          )
          p.write_text(s)

          # Connected Accounts: unknown readiness != configured, while connect
          # remains available to non-operator users; expired means reconnect.
          p = Path('frontend/src/components/ui/ConnectedAccounts.jsx')
          s = p.read_text()
          if "unknown: { variant: 'default', icon: null, label: 'Readiness unknown' }" not in s:
              s = s.replace(
                  "  ready: { variant: 'info', icon: CheckCircle2, label: 'Ready to connect' },\n",
                  "  ready: { variant: 'info', icon: CheckCircle2, label: 'Ready to connect' },\n"
                  "  unknown: { variant: 'default', icon: null, label: 'Readiness unknown' },\n",
                  1,
              )
          s = sub_once(
              s,
              r"if \(readiness && readiness\.configured === false\) return 'setup_required';\s*if \(canConnect && \(!readiness \|\| readiness\.configured\)\) return 'ready';\s*if \(connectionCapability === 'planned'\) return 'unavailable';",
              "if (readiness && readiness.configured === false) return 'setup_required';\n  if (canConnect && readiness?.configured === true) return 'ready';\n  if (canConnect) return 'unknown';\n  if (connectionCapability === 'planned') return 'unavailable';",
              'Connected Accounts readiness state',
              re.S,
          )
          s = sub_once(
              s,
              r"\{connected && !viaFacebook \? \(.*?\) : state === 'ready' \? \(.*?\) : state === 'expired' \? \(.*?\) : null\}",
              """{state === 'expired' ? (
                          <Button size=\"sm\" icon={RefreshCw} onClick={() => handleConnect(platform)}>
                            Reconnect
                          </Button>
                        ) : connected && !viaFacebook ? (
                          <Button
                            variant=\"danger\"
                            size=\"sm\"
                            loading={Boolean(loading[key])}
                            onClick={() => handleDisconnect(platform)}
                          >
                            {t('accounts.disconnect')}
                          </Button>
                        ) : state === 'ready' || state === 'unknown' ? (
                          <Button
                            size=\"sm\"
                            onClick={() => handleConnect(platform)}
                            style={{ background: platform.color }}
                          >
                            {t('accounts.connect', undefined, { platform: platformLabel })}
                          </Button>
                        ) : null}""",
              'Connected Accounts action flow',
              re.S,
          )
          p.write_text(s)

          # Realtime: invalidate stale async refresh continuations on close,
          # unmount, or cross-tab token replacement.
          p = Path('frontend/src/hooks/useRealtime.js')
          s = p.read_text()
          if 'const connectionGeneration = useRef(0);' not in s:
              s = s.replace(
                  '  const attempt = useRef(0);\n',
                  '  const attempt = useRef(0);\n  const connectionGeneration = useRef(0);\n',
                  1,
              )
          s = sub_once(
              s,
              r"const close = useCallback\(\(\) => \{.*?setStatus\('closed'\);\s*\}, \[\]\);",
              """const close = useCallback(() => {
    connectionGeneration.current += 1;
    if (reconnectTimer.current) { clearTimeout(reconnectTimer.current); reconnectTimer.current = null; }
    if (pingTimer.current) { clearInterval(pingTimer.current); pingTimer.current = null; }
    if (wsRef.current) {
      try { wsRef.current.close(); } catch {}
      wsRef.current = null;
    }
    setStatus('closed');
  }, []);""",
              'Realtime close callback',
              re.S,
          )
          s = sub_once(
              s,
              r"(const token = \(typeof localStorage !== 'undefined'\) \? localStorage\.getItem\('access_token'\) : null;\s*if \(!token\) return; // wait until login finishes\s*)(setStatus\('connecting'\);)",
              r"\1const generation = ++connectionGeneration.current;\n    \2",
              'Realtime connect generation',
              re.S,
          )
          s = sub_once(
              s,
              r"ws\.onclose = async \(e\) => \{.*?\n\s*\};(?=\n\s*ws\.onerror)",
              """ws.onclose = async (e) => {
      if (connectionGeneration.current !== generation || wsRef.current !== ws) return;

      if (pingTimer.current) { clearInterval(pingTimer.current); pingTimer.current = null; }
      wsRef.current = null;
      setStatus('closed');

      if (e.code === 4401) {
        try {
          await refreshAccessToken(token);
          if (connectionGeneration.current !== generation) return;
          attempt.current = 0;
          connect();
        } catch {
          if (connectionGeneration.current === generation) {
            invalidateSession({ expectedAccessToken: token });
          }
        }
        return;
      }
      if (e.code === 4403) return;
      scheduleReconnect();
    };""",
              'Realtime onclose',
              re.S,
          )
          p.write_text(s)

          # Auth coordinator: carry the token that actually failed, persist token
          # rotation, and never overwrite/invalidate a newer cross-tab session.
          Path('frontend/src/lib/auth/session.js').write_text("""import axios from 'axios';

          const REFRESH_LOCK = 'social-stats.jwt-refresh';
          const INVALIDATION_KEY = 'social-stats.session-invalidated';
          const sessionInvalidationListeners = new Set();
          let refreshPromise = null;

          function apiBaseUrl() {
            return process.env.REACT_APP_API_URL || 'http://localhost:8000/api';
          }

          function storage() {
            return typeof localStorage === 'undefined' ? null : localStorage;
          }

          function notifyInvalidated() {
            sessionInvalidationListeners.forEach((listener) => listener());
          }

          export function onSessionInvalidated(listener) {
            sessionInvalidationListeners.add(listener);
            return () => sessionInvalidationListeners.delete(listener);
          }

          export function invalidateSession({ broadcast = true, expectedAccessToken } = {}) {
            const store = storage();
            if (!store) {
              notifyInvalidated();
              return true;
            }
            try {
              const currentAccess = store.getItem('access_token');
              if (expectedAccessToken && currentAccess !== expectedAccessToken) return false;
              store.removeItem('access_token');
              store.removeItem('refresh_token');
              if (broadcast) {
                store.setItem(INVALIDATION_KEY, JSON.stringify({
                  at: Date.now(),
                  expectedAccessToken: expectedAccessToken || null,
                }));
              }
            } catch {}
            notifyInvalidated();
            return true;
          }

          function currentSession(store) {
            return {
              access: store.getItem('access_token') || '',
              refresh: store.getItem('refresh_token') || '',
            };
          }

          function sessionChanged(before, after) {
            return before.access !== after.access || before.refresh !== after.refresh;
          }

          async function performRefresh(failedAccessToken) {
            const store = storage();
            if (!store) throw new Error('Session storage unavailable');

            const before = currentSession(store);
            if (failedAccessToken && before.access && before.access !== failedAccessToken) {
              return before.access;
            }
            if (!before.refresh) throw new Error('Refresh token unavailable');

            let response;
            try {
              response = await axios.post(`${apiBaseUrl()}/auth/refresh/`, { refresh: before.refresh });
            } catch (error) {
              const afterFailure = currentSession(store);
              if (sessionChanged(before, afterFailure) && afterFailure.access) {
                return afterFailure.access;
              }
              throw error;
            }

            const afterRequest = currentSession(store);
            if (sessionChanged(before, afterRequest)) {
              if (afterRequest.access && afterRequest.refresh) return afterRequest.access;
              throw new Error('Session changed while refresh was in flight');
            }

            const access = response.data?.access;
            if (!access) throw new Error('Refresh response did not include an access token');
            store.setItem('access_token', access);
            if (response.data?.refresh) store.setItem('refresh_token', response.data.refresh);
            return access;
          }

          async function coordinatedRefresh(failedAccessToken) {
            if (typeof navigator !== 'undefined' && navigator.locks?.request) {
              return navigator.locks.request(
                REFRESH_LOCK,
                () => performRefresh(failedAccessToken),
              );
            }
            return performRefresh(failedAccessToken);
          }

          export function refreshAccessToken(failedAccessToken) {
            if (refreshPromise) return refreshPromise;
            const failedToken = failedAccessToken || storage()?.getItem('access_token') || '';
            refreshPromise = coordinatedRefresh(failedToken)
              .finally(() => { refreshPromise = null; });
            return refreshPromise;
          }

          if (typeof window !== 'undefined') {
            window.addEventListener('storage', (event) => {
              if (event.key !== INVALIDATION_KEY || !event.newValue) return;
              try {
                const payload = JSON.parse(event.newValue);
                invalidateSession({
                  broadcast: false,
                  expectedAccessToken: payload.expectedAccessToken || undefined,
                });
              } catch {
                invalidateSession({ broadcast: false });
              }
            });
          }
          """)

          # HTTP 401: use the bearer token that produced the response.
          p = Path('frontend/src/services/api.js')
          s = p.read_text()
          s = sub_once(
              s,
              r"function _redirectToLogin\(\) \{\s*invalidateSession\(\);\s*if \(typeof window === 'undefined'\) return;",
              "function _redirectToLogin(expectedAccessToken) {\n  const invalidated = invalidateSession({ expectedAccessToken });\n  if (!invalidated || typeof window === 'undefined') return;",
              'API redirect helper',
              re.S,
          )
          s = sub_once(
              s,
              r"try \{\s*const access = await refreshAccessToken\(\);\s*original\.headers\.Authorization = `Bearer \$\{access\}`;\s*return api\(original\);\s*\} catch \{\s*_redirectToLogin\(\);\s*return Promise\.reject\(error\);\s*\}",
              """const authorization = original?.headers?.get?.('Authorization')
      || original?.headers?.Authorization
      || original?.headers?.authorization
      || '';
    const failedAccessToken = typeof authorization === 'string' && authorization.startsWith('Bearer ')
      ? authorization.slice(7)
      : localStorage.getItem('access_token');

    try {
      const access = await refreshAccessToken(failedAccessToken);
      original.headers.Authorization = `Bearer ${access}`;
      return api(original);
    } catch {
      _redirectToLogin(failedAccessToken);
      return Promise.reject(error);
    }""",
              'API refresh retry',
              re.S,
          )
          p.write_text(s)
          PY

      - name: Add regression coverage
        shell: bash
        run: |
          cat > frontend/src/lib/auth/session.test.js <<'EOF'
          import axios from 'axios';
          import { invalidateSession, refreshAccessToken } from './session';

          jest.mock('axios');

          describe('auth session coordinator', () => {
            beforeEach(() => {
              localStorage.clear();
              axios.post.mockReset();
              Object.defineProperty(navigator, 'locks', { configurable: true, value: undefined });
            });

            test('serializes concurrent refreshes and persists rotated refresh tokens', async () => {
              localStorage.setItem('access_token', 'access-old');
              localStorage.setItem('refresh_token', 'refresh-old');
              let resolveRefresh;
              axios.post.mockReturnValue(new Promise((resolve) => { resolveRefresh = resolve; }));
              const first = refreshAccessToken('access-old');
              const second = refreshAccessToken('access-old');
              expect(axios.post).toHaveBeenCalledTimes(1);
              resolveRefresh({ data: { access: 'access-new', refresh: 'refresh-new' } });
              await expect(first).resolves.toBe('access-new');
              await expect(second).resolves.toBe('access-new');
              expect(localStorage.getItem('refresh_token')).toBe('refresh-new');
            });

            test('late 401 reuses the completed refresh', async () => {
              localStorage.setItem('access_token', 'access-new');
              localStorage.setItem('refresh_token', 'refresh-new');
              await expect(refreshAccessToken('access-old')).resolves.toBe('access-new');
              expect(axios.post).not.toHaveBeenCalled();
            });

            test('reuses a token refreshed by another tab after the browser lock', async () => {
              localStorage.setItem('access_token', 'access-old');
              localStorage.setItem('refresh_token', 'refresh-old');
              const request = jest.fn(async (_name, callback) => {
                localStorage.setItem('access_token', 'access-other');
                localStorage.setItem('refresh_token', 'refresh-other');
                return callback();
              });
              Object.defineProperty(navigator, 'locks', { configurable: true, value: { request } });
              await expect(refreshAccessToken('access-old')).resolves.toBe('access-other');
              expect(axios.post).not.toHaveBeenCalled();
            });

            test('discards refresh response after session invalidation', async () => {
              localStorage.setItem('access_token', 'access-old');
              localStorage.setItem('refresh_token', 'refresh-old');
              let resolveRefresh;
              axios.post.mockReturnValue(new Promise((resolve) => { resolveRefresh = resolve; }));
              const pending = refreshAccessToken('access-old');
              invalidateSession();
              resolveRefresh({ data: { access: 'stale-access', refresh: 'stale-refresh' } });
              await expect(pending).rejects.toThrow('Session changed while refresh was in flight');
              expect(localStorage.getItem('access_token')).toBeNull();
              expect(localStorage.getItem('refresh_token')).toBeNull();
            });

            test('conditional invalidation cannot clear a newer session', () => {
              localStorage.setItem('access_token', 'access-new');
              localStorage.setItem('refresh_token', 'refresh-new');
              expect(invalidateSession({ expectedAccessToken: 'access-old' })).toBe(false);
              expect(localStorage.getItem('access_token')).toBe('access-new');
            });

            test('invalidation preserves unrelated preferences', () => {
              localStorage.setItem('access_token', 'access');
              localStorage.setItem('refresh_token', 'refresh');
              localStorage.setItem('language', 'fa');
              expect(invalidateSession()).toBe(true);
              expect(localStorage.getItem('language')).toBe('fa');
            });
          });
          EOF

          cat > backend/social_stats/tests/test_oauth_readiness.py <<'EOF'
          from django.test import SimpleTestCase, override_settings
          from social_stats.oauth_readiness import oauth_readiness_report


          class OAuthReadinessReportTests(SimpleTestCase):
              @override_settings(
                  GOOGLE_CLIENT_ID='client-id',
                  GOOGLE_CLIENT_SECRET='client-secret',
                  GOOGLE_REDIRECT_URI='https://example.test/api/oauth/google/callback/',
              )
              def test_gmb_uses_business_scope_without_youtube_scope(self):
                  report = oauth_readiness_report()
                  self.assertIn(
                      'https://www.googleapis.com/auth/business.manage',
                      report['google_my_business']['scopes'],
                  )
                  self.assertNotIn(
                      'https://www.googleapis.com/auth/youtube.force-ssl',
                      report['google_my_business']['scopes'],
                  )
                  self.assertIn(
                      'https://www.googleapis.com/auth/youtube.force-ssl',
                      report['youtube']['scopes'],
                  )
          EOF

      - name: Focused validation
        shell: bash
        run: |
          (cd frontend && npm ci && CI=true npm test -- --watchAll=false --runInBand src/lib/auth/session.test.js)
          python3 -m py_compile backend/social_stats/oauth_readiness.py backend/social_stats/oauth_views.py

      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          rm .github/workflows/batch-b-review-fixes-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: address verified Batch B review findings [skip batch-b-review]'
          git push origin HEAD:feat/connected-accounts-batch-b
