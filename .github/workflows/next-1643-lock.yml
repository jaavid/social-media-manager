name: Refresh Next.js 16.4.3 lockfile (upgrade branch)
on:
  push:
    branches:
      - refactor/frontend-next-1643-design
    paths:
      - frontend/package.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'jaavid/social-media-manager'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - name: Regenerate lockfile with npm 10.8.2
        working-directory: frontend
        run: |
          npm install --global npm@10.8.2 --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json');if(p.packages['node_modules/next'].version!=='16.4.3'||p.packages['node_modules/eslint-config-next'].version!=='16.4.3')process.exit(1)"
      - name: Commit reproducible lockfile
        run: |
          if ! git diff --quiet -- frontend/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/package-lock.json
            git commit -m "build(next): regenerate npm lockfile for 16.4.3"
            git push origin HEAD:refactor/frontend-next-1643-design
          fi
