name: Refresh React 19 lockfile (temporary)
on:
  push:
    branches: [build/react19-next16-dependency-refresh]
    paths: [frontend/package.json]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
      - name: Generate deterministic npm lock
        working-directory: frontend
        run: |
          npm install -g npm@10.8.2 --no-audit --no-fund
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json');for (const x of ['react','react-dom']) if (p.packages['node_modules/'+x].version!=='19.3.1') process.exit(1)"
      - name: Commit lock file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git diff --cached --quiet || (git commit -m 'build(react): regenerate npm lock for React 19' && git push)
