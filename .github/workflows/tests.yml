name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}
      docker: ${{ steps.paths.outputs.docker }}
      full_browser: ${{ steps.paths.outputs.full_browser }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify CI change selection
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Select checks (unknown paths and diff errors run everything)
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_changes.py --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    name: Backend — Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: socialstats
          POSTGRES_PASSWORD: socialstats
          POSTGRES_DB: socialstats_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socialstats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Check migration drift
        working-directory: backend
        env:
          DB_NAME: socialstats_test
          DB_USER: socialstats
          DB_PASSWORD: socialstats
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: dashboard.settings
          SECRET_KEY: test-secret-not-for-prod
          DEBUG: "False"
          ANTHROPIC_API_KEY: ""
          ALLOWED_HOSTS: "*"
        run: python manage.py makemigrations social_stats --check --dry-run --verbosity=3

      - name: Platform catalogue consistency
        working-directory: backend
        env:
          SECRET_KEY: test-secret-not-for-prod
          DEBUG: "False"
        run: python manage.py check_platform_config

      - name: Provider conformance contracts
        working-directory: backend
        env:
          SECRET_KEY: test-secret-not-for-prod
          DEBUG: "False"
        run: python manage.py check_provider_conformance

      - name: Deployment source contracts
        working-directory: backend
        env:
          SECRET_KEY: test-secret-not-for-prod
          DEBUG: "False"
        run: python manage.py check_deployment_runtime --local-only

      - name: Run Django tests
        working-directory: backend
        env:
          DB_NAME: socialstats_test
          DB_USER: socialstats
          DB_PASSWORD: socialstats
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: dashboard.settings
          SECRET_KEY: test-secret-not-for-prod
          DEBUG: "False"
          ANTHROPIC_API_KEY: ""
          ALLOWED_HOSTS: "*"
          TEST_RUNTIME_METRICS_REDIS_URL: redis://localhost:6379/15
        run: python manage.py test social_stats.tests --verbosity=1

  frontend_checks:
    name: Frontend — production contracts
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin frontend npm
        run: npm install --global npm@10.8.2 --no-audit --no-fund

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund && npm run check:dependencies

      - name: Next source independence
        working-directory: frontend
        run: npm run check:next

      - name: ESLint warning ratchet
        working-directory: frontend
        run: npm run lint

      - name: Source architecture
        working-directory: frontend
        run: npm run check:architecture

      - name: Locale and user-facing string contracts
        working-directory: frontend
        run: npm run i18n:check

      - name: TypeScript boundaries
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        env:
          CI: "true"
        run: npm run build

      - name: API and WebSocket proxy contracts
        working-directory: frontend
        run: |
          npm run test:proxy
          npm run test:proxy -- --mismatch

      - name: Run Jest tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test

      - name: Cache Chromium binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Native Next browser smoke
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:next:smoke

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-next-browser-failures
          path: frontend/test-results/
          retention-days: 7

  frontend:
    name: Frontend — build + Jest tests
    needs: [changes, frontend_checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require selected frontend contracts or an intentional path skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend_checks.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$FRONTEND_REQUIRED" = true ]; then
            test "$FRONTEND_RESULT" = success
          else
            test "$FRONTEND_REQUIRED" = false
            test "$FRONTEND_RESULT" = skipped
          fi

  docker:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    name: Docker — unified stack boots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/change-me-to-a-long-random-secret/test-secret-key-for-docker-ci-only/' .env
          sed -i 's/change-me-to-a-strong-database-password/socialstats-test-password/' .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for app health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "app healthy"; exit 0
            fi
            sleep 5
          done
          echo "app never became healthy"
          docker compose logs app | tail -100
          exit 1

      - name: Verify unprivileged runtime and writable paths
        run: |
          docker compose exec -T app python - < scripts/check_runtime_privileges.py
          docker compose exec -T app nginx -t

      - name: Request correlation and secret-safe ingress logs
        run: |
          python3 scripts/check_observability_stack.py http://localhost:3000

      - name: Next rendering, assets and Django routing share one origin
        run: python3 scripts/check_next_stack.py http://localhost:3000

      - name: Health includes the frontend process
        run: |
          docker compose exec -T app supervisorctl stop next
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)
          test "$code" = 500
          docker compose exec -T app supervisorctl start next
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/healthz; then exit 0; fi
            sleep 1
          done
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin frontend npm
        run: npm install --global npm@10.8.2 --no-audit --no-fund

      - name: Install browser test dependencies
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund && npm run check:dependencies

      - name: Cache Chromium binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Browser parity through the unified production ingress
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:3000
          FULL_BROWSER: ${{ needs.changes.outputs.full_browser }}
        run: |
          if [ "$FULL_BROWSER" = true ]; then
            npm run test:next
          else
            npm run test:next:smoke
          fi

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unified-ingress-browser-failures
          path: frontend/test-results/
          retention-days: 7

      - name: Actual browser session through nginx and the server DAL
        env:
          BROWSER_TEST_EMAIL: contract-tests@example.invalid
          BROWSER_TEST_PASSWORD: LocalContractTests!234
        run: |
          docker compose exec -T app python manage.py shell <<'PYTHON'
          from django.contrib.auth.models import User
          from social_stats.models import UserProfile
          user, _ = User.objects.get_or_create(username='contract-tests@example.invalid', defaults={'email': 'contract-tests@example.invalid'})
          user.set_password('LocalContractTests!234')
          user.save()
          UserProfile.objects.update_or_create(user=user, defaults={'role': 'superadmin', 'account_type': 'legacy'})
          PYTHON
          python3 scripts/check_browser_session.py http://localhost:3000

      - name: Seed demo data inside app container
        run: docker compose exec -T app python manage.py demo_setup

      - name: Verify supervised processes and Celery periodic tasks
        run: |
          docker compose exec -T app supervisorctl status | tee /tmp/supervisor.txt
          grep -E '^next[[:space:]]+RUNNING' /tmp/supervisor.txt
          grep -E '^django[[:space:]]+RUNNING' /tmp/supervisor.txt
          grep -E '^celery[[:space:]]+RUNNING' /tmp/supervisor.txt
          grep -E '^beat[[:space:]]+RUNNING' /tmp/supervisor.txt
          grep -E '^nginx[[:space:]]+RUNNING' /tmp/supervisor.txt

          docker compose exec -T app python manage.py check_deployment_runtime
          docker compose exec -T app python manage.py runtime_metrics --strict

      - name: Teardown
        if: always()
        run: docker compose down -v
