name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: socialstats
          POSTGRES_PASSWORD: socialstats
          POSTGRES_DB: socialstats_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socialstats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Check migration drift
        working-directory: backend
        env:
          DB_NAME: socialstats_test
          DB_USER: socialstats
          DB_PASSWORD: socialstats
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: dashboard.settings
          SECRET_KEY: test-secret-not-for-prod
          DEBUG: "False"
          ANTHROPIC_API_KEY: ""
          ALLOWED_HOSTS: "*"
        run: python manage.py makemigrations social_stats --check --dry-run --verbosity=3

      - name: Run Django tests
        working-directory: backend
        env:
          DB_NAME: socialstats_test
          DB_USER: socialstats
          DB_PASSWORD: socialstats
          DB_HOST: localhost
          DB_PORT: "5432"
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          DJANGO_SETTINGS_MODULE: dashboard.settings
          SECRET_KEY: test-secret-not-for-prod
          DEBUG: "False"
          ANTHROPIC_API_KEY: ""
          ALLOWED_HOSTS: "*"
        run: python manage.py test social_stats.tests --verbosity=1

  frontend:
    name: Frontend — build + Jest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Production build
        working-directory: frontend
        env:
          CI: "true"
        run: npm run build

      - name: Run Jest tests
        working-directory: frontend
        env:
          CI: "true"
        run: npm test

  docker:
    name: Docker — unified stack boots
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Prepare test environment
        run: |
          cp .env.example .env
          sed -i 's/change-me-to-a-long-random-secret/test-secret-key-for-docker-ci-only/' .env
          sed -i 's/change-me-to-a-strong-database-password/socialstats-test-password/' .env

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for app health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "app healthy"; exit 0
            fi
            sleep 5
          done
          echo "app never became healthy"
          docker compose logs app | tail -100
          exit 1

      - name: SPA, static assets and API share one origin
        run: |
          html=$(curl -fsS http://localhost:3000/)
          printf '%s' "$html" | grep -qi "<title>" || { docker compose logs app | tail -50; exit 1; }

          if [[ "$html" =~ src=\"(/static/js/[^\"]+\.js)\" ]]; then
            js_asset="${BASH_REMATCH[1]}"
          else
            echo "React JS asset not found in index.html"
            exit 1
          fi

          if [[ "$html" =~ href=\"(/static/css/[^\"]+\.css)\" ]]; then
            css_asset="${BASH_REMATCH[1]}"
          else
            echo "React CSS asset not found in index.html"
            exit 1
          fi

          curl -fsS "http://localhost:3000${js_asset}" > /dev/null || { echo "React JS asset failed: $js_asset"; exit 1; }
          curl -fsS "http://localhost:3000${css_asset}" > /dev/null || { echo "React CSS asset failed: $css_asset"; exit 1; }
          curl -fsS http://localhost:3000/static/admin/css/base.css > /dev/null || { echo "Django admin static asset failed"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/me/)
          case "$code" in
            401|403)
              echo "API routed correctly; unauthenticated request returned $code"
              ;;
            *)
              echo "expected 401 or 403 from /api/auth/me/, got $code"
              docker compose logs app | tail -50
              exit 1
              ;;
          esac

      - name: Django admin route is reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin/)
          case "$code" in 200|301|302) exit 0 ;; *) echo "unexpected admin status: $code"; exit 1 ;; esac

      - name: Seed demo data inside app container
        run: docker compose exec -T app python manage.py demo_setup

      - name: Verify supervised processes and Celery periodic tasks
        run: |
          docker compose exec -T app supervisorctl status | tee /tmp/supervisor.txt
          grep -E '^django[[:space:]]+RUNNING' /tmp/supervisor.txt
          grep -E '^celery[[:space:]]+RUNNING' /tmp/supervisor.txt
          grep -E '^beat[[:space:]]+RUNNING' /tmp/supervisor.txt
          grep -E '^nginx[[:space:]]+RUNNING' /tmp/supervisor.txt

          docker compose exec -T app celery -A dashboard inspect registered --timeout=10 | tee /tmp/registered.txt
          grep -F 'social_stats.scheduler.process_post_queues' /tmp/registered.txt
          grep -F 'social_stats.scheduler.process_scheduled_posts' /tmp/registered.txt
          grep -F 'social_stats.inbox_tasks.sync_inbox_for_all_clients' /tmp/registered.txt
          grep -F 'social_stats.security.tasks.detect_security_anomalies' /tmp/registered.txt

      - name: Teardown
        if: always()
        run: docker compose down -v
