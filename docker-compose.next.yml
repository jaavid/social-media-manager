# Opt in: docker compose -f docker-compose.yml -f docker-compose.next.yml up -d --build
services:
  app:
    build:
      args:
        REACT_APP_NEXT_ENABLED: "true"
    volumes:
      - ./docker/next-routes.conf:/etc/nginx/next-routes/routes.conf:ro
    depends_on:
      next:
        condition: service_healthy
  next:
    build:
      context: .
      dockerfile: docker/Next.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: "${APP_URL:-http://localhost:3000}"
    restart: unless-stopped
    # No published port: only the existing same-origin ingress exposes Next.
