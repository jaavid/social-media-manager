# Social Stats — production/self-hosted stack
#
# First run:
#   cp .env.example .env
#   docker compose pull
#   docker compose up -d
#
# Build locally instead of pulling GHCR:
#   docker compose up -d --build

services:
  app:
    image: ${SOCIAL_STATS_APP_IMAGE:-ghcr.io/jaavid/social-stats-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DEBUG: "${DEBUG:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      FRONTEND_URL: "${APP_URL:-http://localhost:3000}"
      CORS_ALLOWED_ORIGINS: "${APP_URL:-http://localhost:3000}"
      DB_NAME: "${POSTGRES_DB:-socialstats}"
      DB_USER: "${POSTGRES_USER:-socialstats}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CHANNEL_LAYERS_REDIS_URL: redis://redis:6379/1
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-False}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-False}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-False}"
    ports:
      - "${APP_PORT:-3000}:80"
    volumes:
      - media:/app/backend/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-socialstats}"
      POSTGRES_USER: "${POSTGRES_USER:-socialstats}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialstats} -d ${POSTGRES_DB:-socialstats}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media:
