# Only explicit migrated routes and Next assets go to the Next service.
# All APIs, websockets, backend admin, media and other UI routes retain their owners.
location ~ ^/(privacy|terms|login|pending|admin/account-settings|dashboard/account-settings)/?$ {
    proxy_pass http://next:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $socialstats_forwarded_for;
    proxy_set_header X-Forwarded-Proto $socialstats_proto;
}
location /_next/ {
    proxy_pass http://next:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
}
