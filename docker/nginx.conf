map $http_x_forwarded_proto $socialstats_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Prefer ArvanCloud's documented visitor-IP header when present. Otherwise
# preserve a conventional upstream X-Real-IP, and finally fall back to the
# direct peer address for local/direct deployments.
map $http_ar_real_ip $socialstats_real_ip_stage1 {
    default $http_ar_real_ip;
    ""      $http_x_real_ip;
}
map $socialstats_real_ip_stage1 $socialstats_real_ip {
    default $socialstats_real_ip_stage1;
    ""      $remote_addr;
}

# Do not append the container nginx/Daphne hop to a forwarding chain that has
# already been normalized by the trusted origin proxy. If no chain exists, use
# the best real-IP value above.
map $http_x_forwarded_for $socialstats_forwarded_for {
    default $http_x_forwarded_for;
    ""      $socialstats_real_ip;
}

# Deliberately log only the normalized path, never the raw query-bearing
# request target. OAuth callbacks can carry short-lived authorization codes,
# state values, and provider metadata in the query string; those values must
# never be persisted to production logs.
log_format socialstats_safe '$socialstats_real_ip - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    access_log /dev/stdout socialstats_safe;

    # Container readiness must include Django, not just nginx. This is an
    # internal probe, so mark the hop as already HTTPS when production enables
    # SECURE_SSL_REDIRECT. Otherwise Django redirects the probe instead of
    # returning the service-health JSON directly.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8000/api/health/services/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $socialstats_real_ip;
        proxy_set_header X-Forwarded-For $socialstats_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 5s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Ar-Real-IP $http_ar_real_ip;
        proxy_set_header X-Real-IP $socialstats_real_ip;
        proxy_set_header X-Forwarded-For $socialstats_forwarded_for;
        proxy_set_header X-Forwarded-Proto $socialstats_proto;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Ar-Real-IP $http_ar_real_ip;
        proxy_set_header X-Real-IP $socialstats_real_ip;
        proxy_set_header X-Forwarded-For $socialstats_forwarded_for;
        proxy_set_header X-Forwarded-Proto $socialstats_proto;
        proxy_read_timeout 3600s;
    }

    # /admin/* belongs to the React SPA. Keep Django's framework admin on the
    # reserved /backend/* server-side namespace so SPA refreshes/new tabs are
    # never intercepted by Django.
    location = /backend {
        return 301 /backend/;
    }

    location /backend/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Ar-Real-IP $http_ar_real_ip;
        proxy_set_header X-Real-IP $socialstats_real_ip;
        proxy_set_header X-Forwarded-For $socialstats_forwarded_for;
        proxy_set_header X-Forwarded-Proto $socialstats_proto;
    }

    # React/Vite and Django both use /static/. The entrypoint merges Django's
    # collectstatic output into the frontend build's static directory so one
    # root serves hashed frontend bundles and Django admin assets together.
    location /static/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/backend/media/;
        expires 7d;
    }

    # BrowserRouter routes, including /admin/*, must always fall back to the SPA
    # entry document when there is no real file on disk. This makes refresh and
    # "open in new tab" behave exactly like client-side navigation.
    location / {
        try_files $uri /index.html;
    }
}
