map $http_x_forwarded_proto $socialstats_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Prefer ArvanCloud's documented visitor-IP header when present. Otherwise
# preserve a conventional upstream X-Real-IP, and finally fall back to the
# direct peer address for local/direct deployments.
map $http_ar_real_ip $socialstats_real_ip_stage1 {
    default $http_ar_real_ip;
    ""      $http_x_real_ip;
}
map $socialstats_real_ip_stage1 $socialstats_real_ip {
    default $socialstats_real_ip_stage1;
    ""      $remote_addr;
}

# Do not append the container nginx/Daphne hop to a forwarding chain that has
# already been normalized by the trusted origin proxy. If no chain exists, use
# the best real-IP value above.
map $http_x_forwarded_for $socialstats_forwarded_for {
    default $http_x_forwarded_for;
    ""      $socialstats_real_ip;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Ar-Real-IP $http_ar_real_ip;
        proxy_set_header X-Real-IP $socialstats_real_ip;
        proxy_set_header X-Forwarded-For $socialstats_forwarded_for;
        proxy_set_header X-Forwarded-Proto $socialstats_proto;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Ar-Real-IP $http_ar_real_ip;
        proxy_set_header X-Real-IP $socialstats_real_ip;
        proxy_set_header X-Forwarded-For $socialstats_forwarded_for;
        proxy_set_header X-Forwarded-Proto $socialstats_proto;
        proxy_read_timeout 3600s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header Ar-Real-IP $http_ar_real_ip;
        proxy_set_header X-Real-IP $socialstats_real_ip;
        proxy_set_header X-Forwarded-For $socialstats_forwarded_for;
        proxy_set_header X-Forwarded-Proto $socialstats_proto;
    }

    # React CRA and Django both use /static/. The entrypoint merges Django's
    # collectstatic output into the frontend build's static directory so one
    # root serves hashed React bundles and Django admin assets together.
    location /static/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/backend/media/;
        expires 7d;
    }

    location / {
        try_files $uri /index.html;
    }
}
