[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/socialstats/supervisord.pid
childlogdir=/run/socialstats

[unix_http_server]
file=/run/socialstats/supervisor.sock
chmod=0600

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/socialstats/supervisor.sock

[program:next]
directory=/app/frontend
command=/app/bin/node server.js
environment=NODE_ENV="production",PORT="3000",HOSTNAME="127.0.0.1",NEXT_TELEMETRY_DISABLED="1"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5

[program:django]
directory=/app/backend
# Nginx owns HTTP access logging and intentionally logs $uri without query
# strings. Keep Daphne application/startup logs, but discard its raw access log
# so OAuth callback codes/state values never reach container logs.
command=daphne -b 127.0.0.1 -p 8000 --access-log /dev/null dashboard.asgi:application
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:celery]
directory=/app/backend
command=celery -A dashboard worker -l info
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:beat]
directory=/app/backend
command=celery -A dashboard beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

[program:nginx]
directory=/app/backend
command=python -m social_stats.nginx_logging
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
