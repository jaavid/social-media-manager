# Social Stats — ArvanCloud origin nginx example
#
# Architecture:
#   Browser (HTTPS) -> ArvanCloud CDN/TLS -> origin nginx :80
#                   -> Social Stats app bound on 127.0.0.1:${APP_PORT:-3000}
#
# ArvanCloud provides the visitor address in the `ar-real-ip` request header.
# This origin is expected to be firewalled so only ArvanCloud edge networks can
# reach port 80. Under that condition it is safe to normalize forwarded headers
# from ar-real-ip before sending traffic to the local application.
#
# Pair this with:
#   APP_BIND=127.0.0.1
#   APP_PORT=3000
#   APP_URL=https://social.example.com
#   TRUST_PROXY_CLIENT_IP=True
#   SECURE_SSL_REDIRECT=True
#   SESSION_COOKIE_SECURE=True
#   CSRF_COOKIE_SECURE=True

map $http_upgrade $socialstats_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name social.example.com;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # ArvanCloud's canonical visitor IP. Do not trust a client-supplied XFF
        # chain here; replace it with the CDN-authenticated address instead.
        proxy_set_header Ar-Real-IP $http_ar_real_ip;
        proxy_set_header X-Real-IP $http_ar_real_ip;
        proxy_set_header X-Forwarded-For $http_ar_real_ip;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $socialstats_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
